<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysMusicShow - Catálogo Online</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="assets/CSS/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="bi bi-music-note-beamed fs-4 me-2"></i> SysMusicShow
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarMain">
                <form class="d-flex mx-auto w-50 my-2 my-lg-0">
                    <div class="input-group">
                        <input type="search" class="form-control" placeholder="Buscar instrumentos..." aria-label="Buscar">
                        <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
                    </div>
                </form>
                <div class="d-flex">
                    <a href="login.html" class="btn btn-outline-light btn-sm">Acceso Empleados</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container mt-4">
        <div class="row">
            <!-- Sidebar: Filtros -->
            <aside class="col-lg-3 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold">
                        Filtros de Búsqueda
                    </div>
                    <div class="card-body">
                        <h6 class="mb-2">Categoría / Tipo</h6>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="checkbox" value="Guitarras" id="catGuitarra">
                            <label class="form-check-label" for="catGuitarra">Guitarras</label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" value="Baterias" id="catBateria">
                            <label class="form-check-label" for="catBateria">Baterías</label>
                        </div>

                        <h6 class="mb-2">Rango de Precio</h6>
                        <div class="d-flex gap-2 mb-3">
                            <input type="number" class="form-control form-control-sm" placeholder="Mín">
                            <input type="number" class="form-control form-control-sm" placeholder="Máx">
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Grilla de Productos -->
            <section class="col-lg-9">
                <div class="row g-4" id="contenedorProductos">
                    <!-- Ejemplo de Tarjeta (Esto luego se generará con JS) -->
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm border-0">
                            <!-- Imagen de relleno por ahora -->
                            <div class="bg-secondary bg-opacity-10 text-center py-5">
                                <i class="bi bi-guitar text-secondary" style="font-size: 4rem;"></i>
                            </div>
                            <div class="card-body d-flex flex-column">
                                <h6 class="card-title text-truncate">Guitarra Eléctrica Stratocaster</h6>
                                <p class="card-text fs-5 fw-bold text-success mb-1">$185.000 ARS</p>
                                <span class="badge bg-success bg-opacity-25 text-success mb-3" style="width: fit-content;">En Stock</span>
                                
                                <button class="btn btn-primary mt-auto text-white" style="background-color: #1877F2; border: none;">
                                    <i class="bi bi-facebook me-1"></i> Consultar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/catalogo.js"></script>
</body>
</html>
