<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Music Show</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- CSS compartido del backoffice -->
    <link rel="stylesheet" href="../CSS/admin-style.css">

    <style>
        /* ── Página de login ─────────────────────────────────────── */
        .login-wrapper {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            /* Sutil gradiente radial de fondo */
            background:
                radial-gradient(ellipse at 20% 50%, rgba(44, 15, 66, 0.45) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(243, 122, 31, 0.08) 0%, transparent 50%),
                var(--bg-oscuro, #121212);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-tarjetas, #1e1e1e);
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        /* Logo y encabezado */
        .login-logo {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--color-morado, #2C0F42);
            box-shadow: 0 0 0 4px rgba(44, 15, 66, 0.4);
        }

        .login-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #fff;
        }

        .login-subtitle {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.05em;
        }

        /* Separador de color de marca */
        .brand-divider {
            height: 2px;
            background: linear-gradient(90deg, var(--color-morado, #2C0F42), var(--color-naranja, #f37a1f), transparent);
            border: none;
            border-radius: 2px;
            margin: 1.5rem 0;
            opacity: 1;
        }

        /* Inputs estilo admin */
        .form-control-login {
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 8px;
            padding: 0.65rem 1rem 0.65rem 2.75rem;
            transition: border-color 0.25s, background-color 0.25s;
        }

        .form-control-login::placeholder { color: rgba(255,255,255,0.3); }

        .form-control-login:focus {
            background-color: rgba(255, 255, 255, 0.07);
            border-color: var(--color-naranja, #f37a1f);
            box-shadow: 0 0 0 3px rgba(243, 122, 31, 0.15);
            color: #fff;
            outline: none;
        }

        /* Icono dentro del input */
        .input-group-login {
            position: relative;
        }

        .input-group-login .bi {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.35);
            font-size: 1rem;
            pointer-events: none;
            z-index: 5;
        }

        /* Toggle contraseña */
        .btn-toggle-pass {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.35);
            padding: 0;
            line-height: 1;
            cursor: pointer;
            z-index: 5;
            transition: color 0.2s;
        }

        .btn-toggle-pass:hover { color: rgba(255,255,255,0.7); }

        /* Botón de ingreso */
        .btn-ingresar {
            background: linear-gradient(135deg, var(--color-naranja, #f37a1f), #d9670f);
            border: none;
            color: #fff;
            font-weight: 600;
            letter-spacing: 0.05em;
            border-radius: 8px;
            padding: 0.7rem;
            font-size: 0.95rem;
            transition: opacity 0.2s, transform 0.2s;
        }

        .btn-ingresar:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-ingresar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Alerta de error */
        .alerta-error {
            background-color: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #ff8a95;
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            font-size: 0.85rem;
            display: none;
        }

        .alerta-error.visible { display: flex; align-items: center; gap: 0.5rem; }

        /* Link al catálogo público */
        .link-publico {
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.78rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .link-publico:hover { color: var(--color-naranja, #f37a1f); }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <!-- Encabezado -->
        <div class="text-center mb-2">
            <img src="../img/music show.jpeg"
                 alt="Logo Music Show"
                 class="login-logo mb-3"
                 onerror="this.style.display='none'">
            <p class="login-title mb-0">Music Show</p>
            <p class="login-subtitle">Panel de administración</p>
        </div>

        <hr class="brand-divider">

        <!-- Formulario de login -->
        <form id="formLogin" novalidate>

            <!-- Campo usuario -->
            <div class="mb-3">
                <label for="inputUsuario" class="form-label text-white-50 small mb-1">
                    Usuario o correo electrónico
                </label>
                <div class="input-group-login">
                    <i class="bi bi-person"></i>
                    <input
                        type="text"
                        id="inputUsuario"
                        name="usuario"
                        class="form-control form-control-login w-100"
                        placeholder="admin@musicshow.com"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <!-- Campo contraseña -->
            <div class="mb-4">
                <label for="inputPassword" class="form-label text-white-50 small mb-1">
                    Contraseña
                </label>
                <div class="input-group-login">
                    <i class="bi bi-lock"></i>
                    <input
                        type="password"
                        id="inputPassword"
                        name="password"
                        class="form-control form-control-login w-100"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >
                    <button
                        type="button"
                        class="btn-toggle-pass"
                        id="btnTogglePass"
                        aria-label="Mostrar u ocultar contraseña"
                    >
                        <i class="bi bi-eye" id="iconoPass"></i>
                    </button>
                </div>
            </div>

            <!-- Alerta de error -->
            <div class="alerta-error mb-3" id="alertaError" role="alert" aria-live="polite">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span id="mensajeError">Usuario o contraseña incorrectos.</span>
            </div>

            <!-- Botón ingresar -->
            <button type="submit" class="btn btn-ingresar w-100" id="btnIngresar">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al sistema
            </button>

        </form>

        <!-- Pie -->
        <div class="text-center mt-4">
            <a href="../../index.html" class="link-publico">
                <i class="bi bi-arrow-left me-1"></i>Volver al catálogo público
            </a>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ── Credenciales demo (en un sistema real se validan contra una API) ──────
    const CREDENCIALES_DEMO = {
        usuario: 'admin',
        password: 'musicshow2025'
    };

    // ── Redirigir si ya hay sesión activa ─────────────────────────────────────
    if (localStorage.getItem('usuarioLogueado') === 'true') {
        window.location.replace('admin-menu.html');
    }

    // ── Toggle visibilidad de contraseña ──────────────────────────────────────
    const btnToggle = document.getElementById('btnTogglePass');
    const inputPass = document.getElementById('inputPassword');
    const iconoPass = document.getElementById('iconoPass');

    btnToggle.addEventListener('click', () => {
        const visible = inputPass.type === 'text';
        inputPass.type = visible ? 'password' : 'text';
        iconoPass.className = visible ? 'bi bi-eye' : 'bi bi-eye-slash';
    });

    // ── Manejo del formulario ─────────────────────────────────────────────────
    const form      = document.getElementById('formLogin');
    const alerta    = document.getElementById('alertaError');
    const mensaje   = document.getElementById('mensajeError');
    const btnEnviar = document.getElementById('btnIngresar');

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const usuario  = document.getElementById('inputUsuario').value.trim();
        const password = inputPass.value;

        // Validación básica de campos vacíos
        if (!usuario || !password) {
            mostrarError('Por favor completá todos los campos.');
            return;
        }

        // Simular latencia de autenticación
        btnEnviar.disabled = true;
        btnEnviar.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Verificando…';

        setTimeout(() => {
            const credencialesOk =
                (usuario === CREDENCIALES_DEMO.usuario || usuario === 'admin@musicshow.com') &&
                password === CREDENCIALES_DEMO.password;

            if (credencialesOk) {
                // Guardar sesión y redirigir
                localStorage.setItem('usuarioLogueado', 'true');
                localStorage.setItem('nombreUsuario', 'Administrador');
                window.location.href = 'admin-menu.html';
            } else {
                mostrarError('Usuario o contraseña incorrectos. Intentá de nuevo.');
                btnEnviar.disabled = false;
                btnEnviar.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al sistema';
            }
        }, 700);
    });

    function mostrarError(texto) {
        mensaje.textContent = texto;
        alerta.classList.add('visible');
        // Ocultar la alerta al escribir nuevamente
        form.querySelectorAll('input').forEach(inp =>
            inp.addEventListener('input', () => alerta.classList.remove('visible'), { once: true })
        );
    }
</script>

</body>
</html>
